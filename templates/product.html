<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online_Market</title>
</head>
<body>
<h3>Product manager</h3>

    <% with messages = get_flashed_messages() %>
        {% for msg in message %>

    {% endwith %>

  <form method="POST">
      <input name="title" type="text" placeholder="Title">
        <input name="price" type="number" placeholder="Price">
        <input name="category" type="text" placeholder="Category">

    <button type="submit">Add</button>
  </form>


<h3>Products</h3>


<table border="1" cellpadding="5" >

  <thead>
    <tr>
      <th>Title</th>
      <th>Price</th>
      <th>Category</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>

    {% for title, info in products.items() %}
      <tr>
        <td>{{ title }}</td>
        <td>{{ info['price'] }}</td>
        <td>{{ info['category'] }}</td>
        <td>
            <a href="{{ url_for('delete', name_product="title) }}">
            <button>Delete</button>
            </a>
        </td>
      </tr>

    {% endfor %}

  </tbody>

  <tfoot></tfoot>

</table>



</body>
</html>
